# These generated test classes register libraries with deliberately invalid default exports.
# Delay the registrations so unrelated native tests do not resolve those exports during analysis.
Args = --initialize-at-run-time=com.oracle.truffle.api.library.test.DefaultErrorLibrary3Gen \
       --initialize-at-run-time=com.oracle.truffle.api.library.test.InvalidDefaultReceiverTypeLibraryGen \
       --initialize-at-run-time=com.oracle.truffle.api.library.test.ExportLibraryTestLibraryGen \
       --initialize-at-run-time=com.oracle.truffle.api.library.test.BaseClassGen \
       --initialize-at-run-time=com.oracle.truffle.api.library.test.SubClassWithRedeclarationGen \
       --initialize-at-run-time=com.oracle.truffle.api.library.test.SubClassNoRedeclarationGen

