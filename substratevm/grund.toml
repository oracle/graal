grund_config_version = 2
project_name = "native-image"

[schema]
marker = "§"
shorthand = "accepted" # short §AR-002 labels in system-overview diagrams
id_format = "{kind}-{number}-{slug}"
slug_pattern = "[a-z0-9][a-z0-9-]*"
number_pattern = "\\d+"
section_separator = "."
heading_depth = "must"

[schema.sources]
languages = ["markdown", "java", "shell"]
declarations = "any-comment"
exclude = ["build/", ".gradle/", ".git/", ".idea/", ".agents/", "mxbuild/", "svmbuild/"]
respect_gitignore = false

[schema.notes.lines]
must = 3
may = 1

[schema.notes.columns]
must = 100

[schema.notes.text]
must = true

[schema.kinds.FS]
folders = ["docs/functional-spec"]
index = false

[schema.kinds.FS.fields.reason]
title = "Reason for Existence"
presence = "must"
position = "first"

[schema.kinds.FS.fields.terminology]
title = "Terminology"
presence = "must"
after = "reason"

[schema.kinds.FS.fields.requirements]
title = "Requirements"
presence = "must"
position = "last"

[schema.kinds.FD]
folders = ["docs/functional-spec/decisions"]

# Every FD leads with its reason, then records the choice, tradeoffs and participants.
[schema.kinds.FD.fields.reason]
title = "Reason"
presence = "must"
position = "first"

[schema.kinds.FD.fields.decision]
title = "Decision"
presence = "must"
after = "reason"

[schema.kinds.FD.fields.alternatives]
title = "Alternatives Considered"
presence = "must"
after = "decision"

[schema.kinds.FD.fields.consequences]
title = "Consequences"
presence = "must"
after = "alternatives"

[schema.kinds.FD.fields.participants]
title = "Participants"
presence = "must"
after = "consequences"

[schema.kinds.FD.fields.evidence]
title = "Evidence and Discussion"
presence = "may"
after = "participants"

[schema.kinds.AR]
folders = ["src"]
index = false

# Every AR places itself in the system first, then states its terms, target, design and obligations.
[schema.kinds.AR.fields.system-overview]
title = "System Overview"
presence = "must"
position = "first"

[schema.kinds.AR.fields.terminology]
title = "Terminology"
presence = "must"
after = "system-overview"

[schema.kinds.AR.fields.north-star]
title = "North Star"
presence = "warn"
after = "terminology"

[schema.kinds.AR.fields.design]
title = "Design"
presence = "must"
after = "north-star"

[schema.kinds.AR.fields.requirements]
title = "Requirements"
presence = "must"
position = "last"

[schema.kinds.code]

[presentation]
trigger = "$$"
rules = "root"

[presentation.kinds.FS]
title = "Native Image behavior"

[presentation.kinds.FD]
title = "Native Image functional decisions"

[presentation.kinds.AR]
title = "Native Image architecture"

[presentation.fmt]
anchors = "github"
links = "index"
exclude = []
