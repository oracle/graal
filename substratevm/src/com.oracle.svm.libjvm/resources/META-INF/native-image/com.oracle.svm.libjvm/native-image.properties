Args = \
       --features=com.oracle.svm.libjvm.buildtime.LibJVMFeature \
       @libjvm.args \
       --initialize-at-build-time=com.sun.tools.javac.api.JavacTool \
       -H:+DetectUserDirectoriesInImageHeap \
       -H:+UnlockExperimentalVMOptions \
       -H:JNILibraryLinkage=java:dynamic,nio:dynamic,net:dynamic,extnet:dynamic,jaas:dynamic,sunmscapi:dynamic,zip:dynamic,management_agent:dynamic,management_ext:dynamic,attach:dynamic,prefs:dynamic \
       -H:+RuntimeClassLoading \
       -H:+JNIRegistrationFallback \
       -H:+AddAllCharsets \
       -H:MaxMetaspaceSize=128m \
       -H:+AllowJRTFileSystem \
       -H:+GraalJITCompileAtRuntime \
       -H:+StrictRuntimeJavaOptions \
       -R:+EnableSignalHandling \
       -R:+InstallSegfaultHandler \
       -H:+IncludeWhiteBoxAPI \
       -H:-UnlockExperimentalVMOptions

# Remarks

# -H:+StrictRuntimeJavaOptions intentionally breaks compatibility for recognized but unimplemented
# Java options. Failing fast keeps the remaining full-compatibility work visible instead of
# silently deviating from the user's requested launch configuration (GR-75297).

# -H:+AddAllCharsets
# Makes optional JDK charsets such as UTF-32 available to runtime-loaded code.
#
# -R:+EnableSignalHandling
# Lets runtime-loaded classes install user signal handlers through sun.misc.Signal.
#
# -R:+InstallSegfaultHandler
# Installs the default Native Image handlers for SIGSEGV and SIGBUS in this shared library image.
#
# Libjvm -H:Preserve selectors live in mx.substratevm/mx_substratevm.py so they are supplied by
# the image builder instead of this native-image.properties resource.
